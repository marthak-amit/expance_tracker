name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [claude/focused-clarke-pjmkxs]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Debug-signed so it installs directly; not for Play Store upload.
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
